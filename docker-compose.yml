version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: shopapi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ShopDb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shop-network

  #ShopApi Redis
  redis:
    image: redis:7-alpine
    container_name: shopapi-redis
    ports:
      - "6379:6379"
    volumes:
        - redis_data:/data
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5
    networks:
      - shop-network

  # ShopApi Application
  shopapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopapi-app
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=ShopDb;Username=postgres;Password=postgres;TrustServerCertificate=True;SslMode=Disable;Include Error Detail=true"
      JwtSettings__Secret: "your-super-secret-key-at-least-32-characters-long"
      JwtSettings__Issuer: "ShopApi"
      JwtSettings__Audience: "ShopApiClient"
      JwtSettings__ExpirationMinutes: "60"
      JwtSettings__RefreshTokenExpirationDays: "7"
    ports:
      - "5000:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shop-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis_data:

networks:
  shop-network:
    driver: bridge
