version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: shopapi-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ShopDbTest
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shop-network

  # ShopApi Application (Development)
  shopapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopapi-app-dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=ShopDbTest;Username=postgres;Password=postgres"
      JwtSettings__Secret: "TestSecretKeyThatIsLongEnoughForHS256Algorithm!"
      JwtSettings__Issuer: "TestIssuer"
      JwtSettings__Audience: "TestAudience"
      PaymentService__BaseUrl: "http://payment-service:5000"
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shop-network
    volumes:
      - .:/app:ro
    restart: unless-stopped

volumes:
  postgres-dev-data:

networks:
  shop-network:
    driver: bridge
